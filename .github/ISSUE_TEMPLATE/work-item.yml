name: 작업 이슈
description: 기능, 버그 수정, 리팩터링, 문서 작업을 검토 가능한 단위로 정의합니다.
title: ""
labels: []
body:
  - type: dropdown
    id: component
    attributes:
      label: 주 컴포넌트
      description: 이 Issue를 주로 소유하는 컴포넌트를 선택해 주세요.
      options:
        - Frontend
        - Backend
        - Judge Runner
        - Problem content
        - Documentation / Repository
        - Cross-component flow
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업이 완료됐을 때 사용자가 얻는 결과를 한 가지로 적어 주세요.
      placeholder: 사용자는 ...할 수 있습니다.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 현재 문제와 이 작업이 필요한 이유를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 담당자가 구현할 검토 가능한 작업을 체크리스트로 적어 주세요.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 테스트, API 응답, 화면 동작처럼 관찰 가능한 결과를 적어 주세요.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 제외 범위
      description: 이번 Issue에서 의도적으로 하지 않을 내용을 적어 주세요.
      value: |
        -
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: 의존성 및 관련 링크
      description: 선행·후속 Issue, 관련 PR, contract 또는 ADR을 연결해 주세요.

  - type: textarea
    id: verification
    attributes:
      label: 검증 계획
      description: 완료를 증명할 자동 테스트와 수동 확인을 적어 주세요.
      value: |
        - [ ] 좁은 범위 테스트
        - [ ] 관련 전체 테스트
        - [ ] `git diff --check`
    validations:
      required: true
