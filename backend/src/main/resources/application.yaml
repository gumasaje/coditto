coditto:
  problems:
    root-path: ../problems
  runner:
    python-command: python3
    # Resolve this path from the backend process working directory. Production
    # deployment must set an absolute path instead of relying on this default.
    script-path: ../judge-runner/run.py
    timeout: 75s
  interview:
    openai:
      api-key: ${OPENAI_API_KEY:}
      endpoint: https://api.openai.com/v1/chat/completions
      model: gpt-4o-mini
