# Nginx terminates every public request and proxies to this process on the
# loopback interface. Binding the wildcard address would expose the submission
# endpoint directly and bypass the Nginx request limits.
server:
  address: 127.0.0.1

coditto:
  problems:
    root-path: ../problems
  runner:
    python-command: python3
    # Resolve this path from the backend process working directory. Production
    # deployment must set an absolute path instead of relying on this default.
    script-path: ../judge-runner/run.py
    timeout: 75s
  interview:
    openai:
      api-key: ${OPENAI_API_KEY:}
      endpoint: https://api.openai.com/v1/chat/completions
      model: gpt-4o-mini
