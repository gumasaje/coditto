# This is intentionally an IP-address HTTP origin default. It accepts any
# Host header on a dedicated Coditto VPS. The hackathon deployment places a
# Cloudflare Named Tunnel in front of this origin for browser-facing HTTPS at
# https://coditto.org. Replace this origin setup with a domain virtual host only
# when terminating TLS in Nginx instead of Cloudflare.
#
# The hackathon VPS does not receive inbound 80/tcp, so this server block also
# listens on 443 as plain HTTP and the public entry point is
# http://<public-ip>:443. There is no TLS on the direct IP path. Remove the
# plain 443 listeners in the same change that adds a Certbot certificate, or
# the TLS listener will collide with them.

# Hashed asset filenames change whenever their content does, so they are safe
# to cache for a long time. Everything else, index.html above all, must be
# revalidated or a returning browser keeps running the previous release.
map $uri $coditto_cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

limit_req_zone $binary_remote_addr zone=coditto_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=coditto_judge:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=coditto_per_ip:10m;

server {
    listen 80 default_server;
    listen 443 default_server;
    listen [::]:80 default_server;
    listen [::]:443 default_server;
    server_name _;

    root /srv/coditto/current/frontend/dist;
    index index.html;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $coditto_cache_control always;

    # Throttling is a transport decision, not a Judge verdict, so it answers
    # with the non-judge API error shape instead of a runStatus body.
    limit_req_status 429;
    limit_conn_status 429;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"kind":"RATE_LIMITED"}}';
    }

    location = /api/submissions {
        limit_req zone=coditto_judge burst=2 nodelay;
        limit_conn coditto_per_ip 2;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend's runner timeout is 75 seconds; leave room for cleanup.
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_no_cache 1;
    }

    location /api/ {
        limit_req zone=coditto_api burst=20 nodelay;
        limit_conn coditto_per_ip 10;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_no_cache 1;
    }

    # A missing build artifact must fail loudly instead of being answered with
    # the SPA shell, which would otherwise hide a stale or incomplete release.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
