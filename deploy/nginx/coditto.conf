# This is intentionally an IP-address HTTP rollout default. It accepts any
# Host header on a dedicated Coditto VPS. Replace it with the assigned domain
# before enabling Certbot and HTTPS.

limit_req_zone $binary_remote_addr zone=coditto_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=coditto_judge:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=coditto_per_ip:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/coditto/current/frontend/dist;
    index index.html;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/submissions {
        limit_req zone=coditto_judge burst=2 nodelay;
        limit_conn coditto_per_ip 2;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend's runner timeout is 75 seconds; leave room for cleanup.
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_no_cache 1;
    }

    location /api/ {
        limit_req zone=coditto_api burst=20 nodelay;
        limit_conn coditto_per_ip 10;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_no_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
