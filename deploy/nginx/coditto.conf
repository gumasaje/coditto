# This is intentionally an IP-address HTTP rollout default. It accepts any
# Host header on a dedicated Coditto VPS. Replace it with the assigned domain
# before enabling Certbot and HTTPS.
#
# The hackathon VPS does not receive inbound 80/tcp, so this server block also
# listens on 443 as plain HTTP and the public entry point is
# http://<public-ip>:443. There is no TLS here: remove the plain 443 listeners
# in the same change that adds the certificate, or Certbot will collide with
# them.

limit_req_zone $binary_remote_addr zone=coditto_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=coditto_judge:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=coditto_per_ip:10m;

server {
    listen 80 default_server;
    listen 443 default_server;
    listen [::]:80 default_server;
    listen [::]:443 default_server;
    server_name _;

    root /srv/coditto/current/frontend/dist;
    index index.html;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Throttling is a transport decision, not a Judge verdict, so it answers
    # with the non-judge API error shape instead of a runStatus body.
    limit_req_status 429;
    limit_conn_status 429;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"kind":"RATE_LIMITED"}}';
    }

    location = /api/submissions {
        limit_req zone=coditto_judge burst=2 nodelay;
        limit_conn coditto_per_ip 2;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend's runner timeout is 75 seconds; leave room for cleanup.
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_no_cache 1;
    }

    location /api/ {
        limit_req zone=coditto_api burst=20 nodelay;
        limit_conn coditto_per_ip 10;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_no_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
